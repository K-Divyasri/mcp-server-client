# GitHub Actions workflow for PersonalKB (the MCP server + client).
#
# What this does: every push and every pull request, GitHub spins up a fresh
# Linux machine, installs the exact dependencies from requirements.txt, and
# runs the full pytest suite. Pass -> green check on the commit. Fail -> red
# X and a log to read. Free on public repos.
#
# It is KEYLESS on purpose. This project's whole design is "the MCP protocol
# is never mocked, the LLM call is the only thing ever faked" -- every test
# that touches MCP spawns a real stdio (or real HTTP) server subprocess and
# does real JSON-RPC, and none of that needs a key. The one test that DOES
# call the real Claude API (tests/test_agent_real.py) is decorated
# `@pytest.mark.skipif(not has_api_key(), ...)`, so it self-skips the moment
# ANTHROPIC_API_KEY is unset -- which it always is here. No secret is
# configured anywhere in this workflow, and none is needed.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/tests.yml" at the ROOT
# of your repo. This project publishes the WHOLE project folder (with
# build_from_scratch/ as a subfolder, same shape as the rest of the AI
# track), so the package and its tests live one level down -- that's why the
# steps below run inside build_from_scratch via "working-directory".

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # A standard, free Linux box. The package is pure Python (stdlib sqlite3,
    # mcp, anthropic, requests), so it passes here the same as on Windows.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: build_from_scratch

    steps:
      # Step 1: pull the repo's code onto the runner.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches local dev.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_from_scratch/requirements.txt

      # Step 3: install the project's dependencies. requirements.txt already
      # includes pytest, so this one install is everything the suite needs.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Step 4: seed the notes database. data/ is git-ignored (regenerated,
      # not committed -- see build_from_scratch/.gitignore), and several
      # tests build their own temp DB via conftest.py fixtures regardless,
      # but generating it here mirrors what a fresh clone needs to do before
      # `python -m mcp_kb tools` or `serve` will have any notes to show.
      - name: Seed sample data
        run: python generate_data.py

      # Step 5: run the tests. Every test that touches MCP spawns a REAL
      # server subprocess (stdio, and one real streamable-HTTP subprocess on
      # a free port) and speaks real JSON-RPC over it -- nothing about the
      # protocol layer is mocked. The only test that needs a real API key
      # (test_agent_real.py) skips itself here since ANTHROPIC_API_KEY is
      # unset. Expect 40 passed, 1 skipped.
      - name: Run tests (offline, no API key)
        run: python -m pytest tests -q

[project]
name = "mcp-kb"
version = "0.1.0"
description = "PersonalKB: an MCP server (notes + weather) and a Claude client, built to teach the Model Context Protocol"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "anthropic>=0.68",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-kb = "mcp_kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_kb"]
